# Publishes to npm when a GitHub Release is published. The release tag is the
# source of truth for the version: package.json ships a 0.0.0 placeholder and
# the tag is stamped in here, in the runner, right before publish. An optional
# leading "v" on the tag is stripped, so both `0.2.0` and `v0.2.0` work.
#
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. This requires:
#   1. The package to exist on npm (do one manual bootstrap publish first).
#   2. A trusted publisher configured on npmjs.com for this repo + this
#      workflow file (.github/workflows/release.yml).
# Provenance is attached automatically. `id-token: write` is what lets the
# runner mint the short-lived OIDC token npm verifies.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do NOT set registry-url here: it makes setup-node write an .npmrc with
      # a NODE_AUTH_TOKEN-based authToken line, which shadows OIDC trusted
      # publishing and makes `npm publish` send an empty credential (npm then
      # returns a 404 on the PUT). With no auth .npmrc present, npm uses OIDC.
      - name: Setup Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stamp version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Pick the npm dist-tag from the Release's prerelease flag. npm does NOT
      # infer this from semver, so a prerelease version like 0.2.0-beta.1 would
      # otherwise land on `latest` and hijack plain `npm install
      # foundry-vtt-react`. Prerelease -> `next`, stable -> `latest`.
      #
      # Belt-and-suspenders: fail loudly if the Release's prerelease checkbox
      # disagrees with the version string (a `-` identifier marks a prerelease
      # version per semver). A mismatch means the tag or the checkbox is wrong,
      # and either way the wrong dist-tag would ship — better to stop.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE="${{ github.event.release.prerelease }}"
          case "$VERSION" in
            *-*) VERSION_IS_PRERELEASE=true ;;
            *)   VERSION_IS_PRERELEASE=false ;;
          esac
          if [ "$PRERELEASE" != "$VERSION_IS_PRERELEASE" ]; then
            echo "::error::Release prerelease flag ($PRERELEASE) disagrees with version '$VERSION' (semver prerelease: $VERSION_IS_PRERELEASE). Fix the Release's pre-release checkbox or the tag."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then TAG=next; else TAG=latest; fi
          echo "Publishing $VERSION to dist-tag '$TAG'"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
